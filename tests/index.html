<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Served from the same origin as the game, so a crawler can reach it.
       A page whose title is a pass/fail count has no business in a search
       result. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Engine tests</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0a0b0d; color: #e6e3dc; padding: 24px; }
    ul { line-height: 1.7; }
    li { list-style: none; font-family: ui-monospace, monospace; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="out"></div>
  <script type="module">
    // Import each suite in turn (they register tests via the shared harness),
    // then report once. The same list goes to report(), which re-reads each
    // file off disk and warns if fewer tests registered than exist — a static
    // import cannot be cache-busted, so a stale suite is otherwise invisible.
    const SUITES = ["data.test.js", "engine.test.js", "board.test.js",
                    "invariants.test.js", "fuzz.test.js", "seo.test.js",
                    "shell.test.js", "stage.test.js"];
    for (const name of SUITES) await import(`./${name}`);
    const { report } = await import("./harness.js");
    await report(SUITES);
  </script>
</body>
</html>
