<!doctype html>
<meta charset="utf-8">
<title>Jiangshi tiles — art review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #0c0d10; --panel: #14161b; --line: #262a33;
    --text: #e6e2d8; --muted: #8d8f97; --gold: #d8bd6e;
    --warm: #ffb457; --cool: #6fd3d0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 20px 60px; background: var(--bg); color: var(--text);
         font: 15px/1.55 ui-serif, Georgia, "Songti SC", serif; }
  header { max-width: 1180px; margin: 0 auto 26px; }
  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: .01em; }
  .sub { color: var(--muted); max-width: 62ch; margin: 0 0 14px; }
  .controls { display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
              color: var(--muted); font-size: 13px; }
  .controls label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  h2 { max-width: 1180px; margin: 34px auto 14px; font-size: 15px; letter-spacing: .16em;
       text-transform: uppercase; color: var(--gold); font-weight: 600; }
  .grid { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px;
          grid-template-columns: repeat(auto-fill, minmax(216px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
          overflow: hidden; display: flex; flex-direction: column; }
  .art { position: relative; aspect-ratio: 1; background: #000; }
  .art > svg:first-child { display: block; width: 100%; height: 100%; }
  .indoor .art > svg:first-child  { color: var(--warm); }
  .outdoor .art > svg:first-child { color: var(--cool); }
  .plan { position: absolute; right: 7px; bottom: 7px; width: 34px; height: 34px;
          background: rgba(8,9,11,.72); border-radius: 4px; padding: 3px; }
  .plan line { stroke-linecap: round; }
  .wall { stroke: #7b818d; stroke-width: 5; }
  .door { stroke: var(--gold); stroke-width: 5; }
  .door--seam { stroke: var(--cool); }
  .meta { padding: 10px 12px 13px; border-top: 1px solid var(--line); }
  .name { font-size: 14.5px; margin: 0 0 4px; }
  .blurb { margin: 0 0 8px; font-size: 12.6px; color: #b3b0a6; }
  .tags { display: flex; gap: 5px; flex-wrap: wrap; font: 600 10.5px/1 ui-sans-serif, system-ui;
          letter-spacing: .06em; text-transform: uppercase; }
  .tag { border: 1px solid var(--line); border-radius: 99px; padding: 4px 7px; color: var(--muted); }
  .tag--weapons  { color: #d99a6a; border-color: #4a382c; }
  .tag--magic    { color: #cbb26a; border-color: #4a422c; }
  .tag--medicine { color: #8fbf9a; border-color: #2f4536; }
  .tag--goal     { color: #d97c74; border-color: #4d2c2a; }
  .tag--star     { color: #0c0d10; background: var(--gold); border-color: var(--gold); }
  body.plain .plan { display: none; }
  body.nocast .art > svg:first-child { color: transparent; }
</style>
<header>
  <h1>Jiangshi in the Pocket — the twenty tiles</h1>
  <p class="sub">Pass 1. Every scene is drawn on one of two shells: indoors gets beams,
  a plastered wall and a stone floor under lamplight; outdoors gets sky, the same moon
  in the same corner, hills and ground mist. Cover the captions and the half should
  still be obvious.</p>
  <div class="controls">
    <label><input type="checkbox" id="plans" checked> door plans</label>
    <label><input type="checkbox" id="cast" checked> world cast</label>
    <span id="count"></span>
  </div>
</header>
<main id="out"></main>
<script type="module">
const DIRS = ["N","E","S","W"];
const WALLS = { N:[10,10,90,10], E:[90,10,90,90], S:[10,90,90,90], W:[10,10,10,90] };

const [sprite, tiles, theme] = await Promise.all([
  fetch("../assets/icons.svg").then(r => r.text()),
  fetch("../data/tiles.json").then(r => r.json()),
  fetch("../data/modes/jiangshi/theme.json").then(r => r.json()),
]);
const holder = document.createElement("div");
holder.hidden = true;
holder.innerHTML = sprite;
document.body.appendChild(holder);

function plan(def) {
  const p = ['<svg class="plan" viewBox="0 0 100 100" aria-hidden="true">'];
  for (const d of DIRS) {
    const [x1,y1,x2,y2] = WALLS[d];
    p.push(`<line class="wall" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`);
    if (!def.exits.includes(d) && def.seam !== d) continue;
    const m = (d === "N" || d === "S") ? [34,y1,66,y1] : [x1,34,x1,66];
    p.push(`<line class="door${def.seam === d ? " door--seam" : ""}" x1="${m[0]}" y1="${m[1]}" x2="${m[2]}" y2="${m[3]}"/>`);
  }
  return p.join("") + "</svg>";
}

function tagsFor(def) {
  const t = [];
  if (def.search) t.push(`<span class="tag tag--${def.search}">${def.search}</span>`);
  if (def.best) t.push('<span class="tag tag--star">best of its kind</span>');
  if (def.onTurnEnd === "HEAL_1") t.push('<span class="tag">+1 health</span>');
  if (def.once || def.pray) t.push('<span class="tag">once per night</span>');
  if (def.sanctuary) t.push('<span class="tag">no damage</span>');
  if (def.onResolve) t.push('<span class="tag tag--goal">goal</span>');
  if (def.start) t.push('<span class="tag">start</span>');
  if (def.exteriorDoor) t.push('<span class="tag">moon gate</span>');
  if (def.seam) t.push('<span class="tag">seam</span>');
  if (!t.length) t.push('<span class="tag">transit</span>');
  return t.join("");
}

const out = document.getElementById("out");
let n = 0;
for (const [world, heading] of [["indoor","室內 — the village, and the 義莊 at the end of it"],
                                ["outdoor","室外 — the hillside"]]) {
  out.insertAdjacentHTML("beforeend", `<h2>${heading}</h2><div class="grid ${world}" id="g-${world}"></div>`);
  const grid = document.getElementById(`g-${world}`);
  for (const def of tiles[world]) {
    n++;
    grid.insertAdjacentHTML("beforeend", `
      <article class="card">
        <div class="art">
          <svg viewBox="0 0 96 96" aria-hidden="true"><use href="#scene-${def.id}"/></svg>
          ${plan(def)}
        </div>
        <div class="meta">
          <h3 class="name">${theme.tiles[def.id] || def.id}</h3>
          <p class="blurb">${theme.tileBlurbs[def.id] || ""}</p>
          <div class="tags">${tagsFor(def)}</div>
        </div>
      </article>`);
  }
}
document.getElementById("count").textContent = `${n} tiles`;
document.getElementById("plans").onchange = e => document.body.classList.toggle("plain", !e.target.checked);
document.getElementById("cast").onchange  = e => document.body.classList.toggle("nocast", !e.target.checked);
</script>
