<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Play — Grave Errand</title>
  <meta name="description" content="Play Grave Errand: a solo zombie survival game of room-by-room exploration against the clock.">
  <link rel="canonical" href="https://games.csiesheep.com/zombie_in_the_pocket/game">
  <meta name="theme-color" content="#0a0b0d">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="csiesheep games">
  <meta property="og:title" content="Play Grave Errand">
  <meta property="og:description" content="A solo zombie survival game against the clock. Find the relic, bury it in the family plot before midnight.">
  <meta property="og:url" content="https://games.csiesheep.com/zombie_in_the_pocket/game">
  <meta property="og:image" content="https://games.csiesheep.com/zombie_in_the_pocket/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <header class="topnav">
    <a class="brand" href="index.html">Grave Errand</a>
    <span class="spacer"></span>
    <a href="rulebook.html">Rulebook</a>
    <a href="index.html">Menu</a>
  </header>

  <section class="hud" aria-label="Status">
    <div class="stat"><span class="label">Health</span><span class="value" id="hud-health">6</span></div>
    <div class="stat"><span class="label">Attack</span><span class="value" id="hud-attack">1</span></div>
    <div class="stat"><span class="label">Hour</span><span class="value" id="hud-hour">9 PM</span></div>
    <div class="stat"><span class="label">Items</span><span class="value" id="hud-items">—</span></div>
    <div class="stat"><span class="label">Relic</span><span class="value" id="hud-totem">No</span></div>
  </section>

  <main class="game-layout">
    <section class="board-pane" aria-label="Board">
      <div class="board-controls">
        <button class="navbtn" type="button" id="btn-zoom-out" aria-label="Zoom out">&minus;</button>
        <span class="zoom-label" id="zoom-label">100%</span>
        <button class="navbtn" type="button" id="btn-zoom-in" aria-label="Zoom in">+</button>
        <span class="spacer"></span>
        <span class="hint">Number keys pick an action</span>
      </div>
      <div class="board" id="board" role="group" aria-label="Game board"></div>
    </section>

    <aside class="sidebar">
      <div class="panel">
        <h3>Actions</h3>
        <div id="actions"></div>
      </div>
      <div class="panel">
        <h3>Log</h3>
        <div class="log" id="log" role="log" aria-live="polite" aria-label="Game log"></div>
      </div>
      <div class="panel">
        <h3>This run</h3>
        <p class="runline">Seed <code id="seed-value">&mdash;</code></p>
        <button class="action" type="button" id="btn-copy-seed">Copy replay link</button>
        <button class="action" type="button" id="btn-new-game">New game</button>
      </div>
    </aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
