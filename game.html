       a new filename rather than a new picture at the old one — scrapers cache
       by URL, so replacing the image in place would leave every link that has
       ever been shared showing the old card. -->
  <meta property="og:image" content="https://games.csiesheep.com/jiangshi_in_the_pocket/assets/social-jiangshi.png">

  <!-- The trail, so a search result shows "The Third Watch: The Jiangshi > Play" rather than a
       bare URL. Positions are the real hierarchy: everything on this site is one

<body class="app">
  <header class="topnav">
    <a class="brand" href="index.html" id="brand">The Third Watch: The Jiangshi</a>
    <span class="spacer"></span>
    <a href="rulebook.html" id="nav-rulebook">Rulebook</a>
    <a href="index.html" id="nav-menu">Menu</a>
  </header>


  <main class="game-layout">
    <!-- The app had no h1 anywhere: the brand in the top bar is a link back to
         the menu, not a heading, and a page with no h1 is a page a crawler and a
         screen reader both have to guess the subject of. Off-screen rather than
         drawn, because the board is the title here — the header already says the
         name and a second visible one would be furniture. -->
    <h1 class="sr-only" id="page-title">The Third Watch: The Jiangshi — play in your browser</h1>
    <section class="board-pane" id="board-pane" aria-label="Board">
      <div class="board" id="board" role="group" aria-label="Game board"></div>
      <div class="actions-pop" id="actions-pop" role="group" aria-label="Your move" hidden>
        <div id="actions"></div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="panel panel--status">
        <div class="clockbox" id="hud-hour"></div>
        <div class="statgrid">
          <div class="stat"><span class="statlabel" id="stat-health">Health</span><span class="statval" id="hud-health"></span></div>
          <div class="stat"><span class="statlabel" id="stat-attack">Attack</span><span class="statval" id="hud-attack"></span></div>
          <div class="stat"><span class="statlabel" id="stat-relic">Relic</span><span class="statval" id="hud-tablet"></span></div>
        </div>
        <!-- 中毒 is a state, not a quantity, so it is a band across the panel
             rather than a fourth number in the grid. Absent entirely when clean:
             an empty slot reading "not poisoned" every turn is noise. -->
        <div class="poisonmark" id="hud-poison" hidden></div>
      </div>
      <!-- What you are holding, above what you are carrying: the pack is
           luggage and the hands are the game. Both empty at nine o'clock,
           drawn rather than implied, because bare-handed is zero. -->
      <div class="panel">
        <h3 id="hands-title">In hand</h3>
        <div class="hands" id="hud-hands"></div>
      </div>
      <div class="panel">
        <h3 id="backpack">Backpack</h3>
        <div class="backpack" id="hud-items"></div>
      </div>
      <div class="panel utility">
        <p class="runline"><span id="seed-label">Seed</span> <code id="seed-value">&mdash;</code></p>
        <div class="utilrow">
          <button class="utilbtn" type="button" id="btn-sound" aria-pressed="false" title="Sound" id="btn-sound-title">
            <span class="soundicon" id="sound-icon"></span><span class="sr-only" id="sound-label">Sound off</span>
          </button>
          <button class="utilbtn" type="button" id="btn-note" title="The note from the hall">
            <span class="utilicon" id="note-icon">✉</span><span class="sr-only" id="note-again">Read the note again</span>
          </button>
          <button class="utilbtn" type="button" id="btn-calm" aria-pressed="false"
                  title="Calm mode — the game without the scares">
            <span class="utilicon" id="calm-icon"></span><span class="sr-only" id="calm-label">Calm mode off</span>
          </button>
          <button class="utilbtn" type="button" id="btn-fast" aria-pressed="false"
                  title="Fast mode — the beats without the animations">
            <span class="utilicon" id="fast-icon" aria-hidden="true">&#187;</span><span class="sr-only" id="fast-label">Fast mode off</span>
          </button>
          <button class="utilbtn" type="button" id="btn-fullscreen" aria-pressed="false"
                  title="Fullscreen" hidden>
            <span class="utilicon" id="fs-icon">⛶</span><span class="sr-only" id="fs-label">Fullscreen</span>
          </button>
          <button class="utilbtn" type="button" id="btn-copy-seed" title="Copy replay link">
            <span class="utilicon" id="copy-icon"></span><span class="sr-only" id="copy-replay">Copy replay link</span>
          </button>
          <button class="utilbtn" type="button" id="btn-lang" title="語言 / Language">
            <span class="utilicon" id="lang-icon">文</span><span class="sr-only" id="lang-label">Language</span>
          </button>
          <button class="utilbtn utilbtn--wide" type="button" id="btn-new-game">New game</button>
        </div>
      </div>
    </aside>
  </main>

  <!-- The log panel is gone (it repeated what the board, the hearts and the
       clock already say), but it was also the only spoken narration of events.
       This is where log() writes now: unseen, still announced. -->
  <div class="sr-only" id="log" role="log" aria-live="polite" aria-label="Game narration"></div>

  <!-- Cinema bars for the set-pieces. Empty and inert until body.staged. -->
  <div class="letterbox letterbox--top" aria-hidden="true"></div>
  <div class="letterbox letterbox--bottom" aria-hidden="true"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
