<body class="app">
  <header class="topnav">
    <a class="brand" href="index.html" id="brand">The Third Watch: The Jiangshi</a>
    <span class="spacer"></span>
    <a href="rulebook.html" id="nav-rulebook">Rulebook</a>
    <a href="index.html" id="nav-menu">Menu</a>
    <!-- Last in the bar and after the two links, on purpose: this abandons a run
         in progress, and a control that does that should not sit where a thumb
         reaching for "Menu" lands. -->
    <button class="topbtn" type="button" id="btn-new-game">New game</button>
    <!-- The language control (#73), moved up from the utility panel when that
         panel went. Last in the bar: it is the quietest thing here and it is
         the only one that does not touch the run. -->
    <!-- The language switch is appended here by js/langswitch.js (#78), which
         every page shares. Not in the markup on purpose: a page with JS off
         should not offer a switch that cannot work. -->
  </header>


  <main class="game-layout">
    <!-- The app had no h1 anywhere: the brand in the top bar is a link back to
         the menu, not a heading, and a page with no h1 is a page a crawler and a
         screen reader both have to guess the subject of. Off-screen rather than
         drawn, because the board is the title here — the header already says the
         name and a second visible one would be furniture. -->
    <h1 class="sr-only" id="page-title">The Third Watch: The Jiangshi — play in your browser</h1>
    <section class="board-pane" id="board-pane" aria-label="Board">
      <div class="board" id="board" role="group" aria-label="Game board"></div>
      <div class="actions-pop" id="actions-pop" role="group" aria-label="Your move" hidden>
        <div id="actions"></div>
      </div>
    </section>

    <!-- ONE PANEL, not three. The clock, what you are wearing and what you are
         carrying were three bordered cards stacked down the side, which on a
         phone is three sets of chrome around three short lists. They are one
         surface now, in the same order, and the two headings are gone with the
         borders: "Equipment" over a pair of hands and "Backpack" over a grid of
         items were labelling what the drawings already say.

         The clock is the digital reading alone. The analog face went with the
         same change — it and the numerals were two clocks saying one time, and
         the one that reads at a glance on a phone is the one with digits. -->
    <aside class="sidebar">
      <div class="panel">
        <!-- panel--status stays, on the CLOCK AND HEALTH BLOCK rather than on
             the whole panel. It carries --panel-type, which .statlabel,
             .statnum and .clocknum read, and it is what the 600px rule targets
             — left on the merged panel that rule would flex the equipment and
             the pack into a row beside the clock on every phone. -->
        <div class="panel--status">
          <div class="clockrow">
            <div class="clockbox" id="hud-hour"></div>
            <!-- 中毒 sits BESIDE THE CLOCK (#113) rather than in a band of its
                 own below the row. It used to be a 39px block outside this
                 panel that existed only while poisoned, so the no-scroll
                 portrait fit held until you were poisoned and then broke by
                 43px — measured, 667 to 710. Being poisoned is a common state,
                 not an edge, and a layout that fits only in one state is not
                 a fit.

                 The pairing is .clockrow, NOT this whole status block: the
                 stat grid is 270px against a 325px row, so making the status
                 block itself a flex row just wrapped the grid to its own line
                 and added a gap. Measured, 62 to 72. Beside the CLOCK the mark
                 costs no height at all — the clock is 101px and leaves room.
                 Absent entirely when clean; an empty slot reading "not
                 poisoned" every turn is noise. -->
            <div class="poisonmark" id="hud-poison" hidden></div>
          </div>
          <div class="statgrid">
            <div class="stat"><span class="statlabel" id="stat-health">Health</span><span class="statval" id="hud-health"></span></div>
          </div>
        </div>
        <!-- What you are wearing and holding, above what you are carrying: the
             pack is luggage and this is the game. All three drawn rather than
             implied, because bare-handed is zero — and the 神主牌 is DRAWN here
             while still living outside the pack, so it costs no slot. -->
        <div class="hands" id="hud-hands"></div>
        <div class="backpack" id="hud-items"></div>
      </div>
    </aside>
  </main>

  <!-- The log panel is gone (it repeated what the board, the hearts and the
       clock already say), but it was also the only spoken narration of events.
       This is where log() writes now: unseen, still announced. -->
  <div class="sr-only" id="log" role="log" aria-live="polite" aria-label="Game narration"></div>

  <!-- Cinema bars for the set-pieces. Empty and inert until body.staged. -->
  <div class="letterbox letterbox--top" aria-hidden="true"></div>
  <div class="letterbox letterbox--bottom" aria-hidden="true"></div>

  <script type="module" src="js/app.js"></script>
