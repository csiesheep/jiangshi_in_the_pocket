<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Play — Zombie in the Pocket</title>
  <meta name="description" content="Play Zombie in the Pocket: a solo tile-exploration survival game against the clock.">
  <link rel="canonical" href="https://games.csiesheep.com/zombie_in_the_pocket/game">
  <meta name="theme-color" content="#0a0b0d">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="csiesheep games">
  <meta property="og:title" content="Play Zombie in the Pocket">
  <meta property="og:description" content="A solo tile-exploration survival game against the clock. Find the totem, bury it before midnight.">
  <meta property="og:url" content="https://games.csiesheep.com/zombie_in_the_pocket/game">
  <meta property="og:image" content="https://games.csiesheep.com/zombie_in_the_pocket/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <header class="topnav">
    <a class="brand" href="index.html">Zombie in the Pocket</a>
    <span class="spacer"></span>
    <a href="rulebook.html">Rulebook</a>
    <a href="index.html">Menu</a>
  </header>

  <section class="hud">
    <div class="stat"><span class="label">Health</span><span class="value" id="hud-health">6</span></div>
    <div class="stat"><span class="label">Attack</span><span class="value" id="hud-attack">1</span></div>
    <div class="stat"><span class="label">Hour</span><span class="value" id="hud-hour">9 PM</span></div>
    <div class="stat"><span class="label">Items</span><span class="value" id="hud-items">—</span></div>
    <div class="stat"><span class="label">Totem</span><span class="value" id="hud-totem">No</span></div>
  </section>

  <main class="game-layout">
    <div class="board" id="board"></div>

    <aside class="sidebar">
      <div class="panel">
        <h3>Actions</h3>
        <div id="actions"><p class="muted">No game in progress.</p></div>
      </div>
      <div class="panel">
        <h3>Log</h3>
        <div class="log" id="log"><p>Welcome. Press Start to begin.</p></div>
      </div>
    </aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
