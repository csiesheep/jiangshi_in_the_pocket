    <path d="M22 56h52v10H22z"/><path d="M28 66v14M68 66v14"/><path d="M22 74h52"/>
    <path d="M12 78c0-10 4-14 4-14s4 4 4 14"/>
    <path d="M76 78c0-10 4-14 4-14s4 4 4 14"/>
