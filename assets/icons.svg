       these are scenes, not symbols, and the small icons were visibly stretched.
       The 24x24 set stays for the backpack and the status panel.

       Furniture hugs the walls. The middle of every tile is left clear on both
       axes because footprints track through it, the player stands in it, and
       the doorway hotspots land on the edges. -->

  <symbol id="scene-foyer" viewBox="0 0 96 96">
