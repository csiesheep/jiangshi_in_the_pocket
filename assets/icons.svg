    <path d="M12 10V8"/>
    <path d="M12 3c1.5 1.8 2 2.8 2 3.8a2 2 0 0 1-4 0c0-1 .5-2 2-3.8z"/>
  </symbol>

  <!-- ========================== Status ============================
       Drawn on the same 24x24 grid as everything else. The heart is filled or
       hollow from CSS, so one symbol covers both states. -->

  <symbol id="stat-heart" viewBox="0 0 24 24">
    <path d="M12 20.5S3.5 15 3.5 9.2A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 8.5 2.8c0 5.8-8.5 11.3-8.5 11.3z"/>
  </symbol>

  <symbol id="stat-sword" viewBox="0 0 24 24">
    <path d="M20 3.5v3.2L10.4 16.3 7.7 13.6 17.3 4h3.2z"/>
    <path d="M7.7 13.6 5 16.3l2.7 2.7 2.7-2.7"/>
    <path d="M4.2 19.8 6.6 17.4"/>
  </symbol>

  <!-- ========================= Interface ========================== -->

  <!-- Way out. Drawn pointing north; the doorway rotates it per direction, the
       same trick the edge markers use. -->
  <symbol id="ui-chevron" viewBox="0 0 24 24">
    <path d="M5 15.5 12 8.5l7 7"/>
  </symbol>

  <!-- Death warning: a skull, jaw narrower than the cranium so it reads at 14px -->
  <symbol id="ui-skull" viewBox="0 0 24 24">
    <path d="M12 3C7.4 3 3.8 6.5 3.8 10.8c0 2.3 1 4.1 2.6 5.4V18.9a2.3 2.3 0 0 0 2.3 2.3h6.6a2.3 2.3 0 0 0 2.3-2.3v-2.7c1.6-1.3 2.6-3.1 2.6-5.4C20.2 6.5 16.6 3 12 3Z"/>
    <path d="M6.4 18.9h11.2"/>
    <path d="M10.2 21.2v-2.3"/>
    <path d="M13.8 21.2v-2.3"/>
    <circle cx="8.9" cy="11.6" r="1.9" fill="currentColor" stroke="none"/>
    <circle cx="15.1" cy="11.6" r="1.9" fill="currentColor" stroke="none"/>
    <path d="M12 14.3l1.3 2.4h-2.6z" fill="currentColor" stroke="none"/>
  </symbol>

  <symbol id="ui-copy" viewBox="0 0 24 24">
    <rect x="9" y="9" width="11" height="12" rx="2"/>
    <path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/>
  </symbol>

  <symbol id="ui-sound-on" viewBox="0 0 24 24">
    <path d="M4 9h4l5-4v14l-5-4H4z"/>
    <path d="M16.5 8.5a5 5 0 0 1 0 7"/>
    <path d="M19 6a8.5 8.5 0 0 1 0 12"/>
  </symbol>

  <symbol id="ui-sound-off" viewBox="0 0 24 24">
    <path d="M4 9h4l5-4v14l-5-4H4z"/>
    <path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/>
  </symbol>

  <!-- ========================== The risen ==========================
       Drawn on its own 120-unit grid rather than the shared 24, because this
       one is shown full-window and needs the detail. Square to square, so it
       still scales cleanly through the standard 24x24 wrapper. -->

  <symbol id="scare-zombie" viewBox="0 0 120 120">
    <!-- Built for poster size, not for the 24x24 grid. Depth comes from layered
         fill-opacity of currentColor rather than its own palette, so the scare
         still tints with --danger and the hour's flame. On the dark overlay,
         high opacity reads as lit and low as sunk, so the sockets are punched
         clean through with evenodd and the ridges are the bright parts. -->

    <!-- shoulders and neck, sunk furthest back -->
    <path d="M22 120c2-16 12-25 26-29l12-4 12 4c14 4 24 13 26 29z"
          fill="currentColor" fill-opacity=".08" stroke="none"/>
    <path d="M48 86v7c0 5-4 8-10 10M72 86v7c0 5 4 8 10 10"
          stroke-width="2.4" stroke-opacity=".55"/>

    <!-- the skull, with the eye sockets cut out of the same shape -->
    <path fill="currentColor" fill-opacity=".15" stroke="none" fill-rule="evenodd"
          d="M60 12C77 12 90 27 90 45c0 12-3 19-7 24l-2 11c-1 9-9 16-21 16s-20-7-21-16l-2-11c-4-5-7-12-7-24 0-18 13-33 30-33Z
             M37 47a10.5 9 0 1 0 21 0 10.5 9 0 1 0-21 0Z
             M62 47a10.5 9 0 1 0 21 0 10.5 9 0 1 0-21 0Z"/>
    <path d="M60 12C77 12 90 27 90 45c0 12-3 19-7 24l-2 11c-1 9-9 16-21 16s-20-7-21-16l-2-11c-4-5-7-12-7-24 0-18 13-33 30-33Z"
          stroke-width="2.6"/>

    <!-- brow, and the rims that catch the light -->
    <path d="M34 40c6-4 13-6 19-5M67 35c6-1 13 1 19 5" stroke-width="2.6"/>
    <path d="M37 47a10.5 9 0 1 0 21 0 10.5 9 0 1 0-21 0Z" stroke-width="2.2"/>
    <path d="M62 47a10.5 9 0 1 0 21 0 10.5 9 0 1 0-21 0Z" stroke-width="2.2"/>
    <path d="M41 40c4-2 9-2 13 1M66 41c4-3 9-3 13-1" stroke-width="1.6" stroke-opacity=".7"/>

    <!-- cheekbones -->
    <path d="M34 58c3 4 7 7 11 8M86 58c-3 4-7 7-11 8" stroke-width="2" stroke-opacity=".65"/>

    <!-- nose cavity, punched dark -->
    <path d="M60 56l-6 14h12z" fill="currentColor" fill-opacity=".05" stroke-width="2.2"/>

    <!-- jaw and bared teeth -->
    <path d="M42 78h36" stroke-width="2.6"/>
    <path d="M45 78v8M52 78v10M59 78v9M66 78v10M73 78v8" stroke-width="2.2"/>
    <path d="M44 88c5 3 11 4 16 4s11-1 16-4" stroke-width="2.4"/>
    <path d="M47 71h26" stroke-width="1.6" stroke-opacity=".5"/>

    <!-- torn cheek, one side only so the face is not symmetrical -->
    <path d="M78 62c5 1 8 4 9 8-4 1-7 0-9-2z" fill="currentColor" fill-opacity=".22" stroke-width="1.8"/>
    <path d="M80 64l4 3" stroke-width="1.4" stroke-opacity=".6"/>

    <!-- cracks across the cranium -->
    <path d="M46 20l5 7-4 6M74 18l-4 8 5 6M60 14v8" stroke-width="2" stroke-opacity=".7"/>
    <path d="M33 33l6 3M87 33l-6 3" stroke-width="1.6" stroke-opacity=".5"/>

    <!-- hands coming up out of the dark -->
    <path d="M6 120c0-10 3-17 8-21" stroke-width="3"/>
    <path d="M14 99c-3-5-1-10 3-11s7 2 8 6M25 92c-1-5 1-9 5-9s6 4 6 8M36 90c0-5 3-8 6-7s4 5 3 9"
          stroke-width="2.8"/>
    <path d="M114 120c0-10-3-17-8-21" stroke-width="3"/>
    <path d="M106 99c3-5 1-10-3-11s-7 2-8 6M95 92c1-5-1-9-5-9s-6 4-6 8M84 90c0-5-3-8-6-7s-4 5-3 9"
          stroke-width="2.8"/>
  </symbol>

  <!-- ======================= Edges of a room =======================
       All drawn for the north wall, on the same 24x24 grid as everything else
       so they are not letterboxed: the wall runs along y=12, the room is below
       it, and "outward" is up. render.js rotates these for the other three
       sides, and the marker is centred on the wall so the two halves fall
       inside and outside the room. -->

  <!-- Shut: a panelled leaf filling the gap, handle catching the light. This is
       the explore affordance, so it should look like an invitation. -->
  <symbol id="edge-door-closed" viewBox="0 0 24 24">
    <rect x="3" y="7" width="18" height="10" rx=".8" fill="currentColor" fill-opacity=".2"/>
    <rect x="3" y="7" width="18" height="10" rx=".8" stroke-width="1.7"/>
    <rect x="5.4" y="9" width="5.6" height="6" rx=".4" stroke-width="1.1" stroke-opacity=".75"/>
    <rect x="13" y="9" width="5.6" height="6" rx=".4" stroke-width="1.1" stroke-opacity=".75"/>
    <circle cx="18.6" cy="12" r="1.05" fill="currentColor"/>
  </symbol>

  <!-- Open: jambs stand, the leaf rests where the swing animation leaves it,
       and the opening itself is darkness. -->
  <symbol id="edge-door-open" viewBox="0 0 24 24">
    <path d="M2.6 6.4v11.2M21.4 6.4v11.2" stroke-width="2"/>
    <path d="M3.4 12L13.6 21.6" stroke-width="2.8"/>
    <path d="M5 13.6l7.6 7.2" stroke-width="1" stroke-opacity=".45"/>
  </symbol>

  <!-- Blocked: boarded over. A door that will never open, not a grey one. -->
