<!-- Grave Errand icon sprite. Hand-authored, house style: 24x24, line art in
     currentColor so tiles and HUD tint it themselves. Fetched once by
     render.js and injected inline, because external <use> references are not
     reliable across browsers. Symbol ids are `tile-<tileId>` / `item-<itemId>`
     and must match the ids in data/tiles.json and data/items.json. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <style>
      symbol { fill: none; stroke: currentColor; stroke-width: 1.5;
               stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- ============================ Tiles ============================ -->

  <!-- Entry Hall: a front door, ajar -->
  <symbol id="tile-foyer" viewBox="0 0 24 24">
    <path d="M6 3h9a2 2 0 0 1 2 2v16H6z"/>
    <circle cx="13.5" cy="12" r="1"/>
    <path d="M17 21h3"/>
  </symbol>

  <!-- Washroom: basin and tap -->
  <symbol id="tile-bathroom" viewBox="0 0 24 24">
    <path d="M4 12h16v3a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/>
    <path d="M12 12V7a3 3 0 0 1 3-3h2"/>
    <path d="M15 7h1"/>
  </symbol>

  <!-- Bedchamber: a bed -->
  <symbol id="tile-bedroom" viewBox="0 0 24 24">
    <path d="M3 18v-6h14a4 4 0 0 1 4 4v2"/>
    <path d="M3 12V8"/>
    <path d="M3 18h18"/>
    <circle cx="7.5" cy="9.5" r="1.5"/>
  </symbol>

  <!-- Parlour: an armchair -->
  <symbol id="tile-family-room" viewBox="0 0 24 24">
    <path d="M6 11V7a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4"/>
    <path d="M4 12a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4H4z"/>
    <path d="M6 16v3M18 16v3"/>
  </symbol>

  <!-- Dining Hall: plate between knife and fork -->
  <symbol id="tile-dining-room" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4.5"/>
    <path d="M4 5v6M4 11v8"/>
    <path d="M20 5v6a2 2 0 0 1-2 2M20 13v6"/>
  </symbol>

  <!-- Pantry: shelves with jars -->
  <symbol id="tile-storage" viewBox="0 0 24 24">
    <path d="M4 4h16v16H4z"/>
    <path d="M4 12h16"/>
    <path d="M8 7v3M12 7v3M16 7v3"/>
    <path d="M9 15v3M15 15v3"/>
  </symbol>

  <!-- Kitchen: a pot, steaming -->
  <symbol id="tile-kitchen" viewBox="0 0 24 24">
    <path d="M4 11h16v4a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/>
    <path d="M2 11h20"/>
    <path d="M9 7c0-1.5 1.5-1.5 1.5-3M14 7c0-1.5 1.5-1.5 1.5-3"/>
  </symbol>

  <!-- Reliquary: a casket, lit from within -->
  <symbol id="tile-evil-temple" viewBox="0 0 24 24">
    <path d="M4 10h16v9H4z"/>
    <path d="M4 10l3-4h10l3 4"/>
    <path d="M12 13v3"/>
    <path d="M9.5 14.5h5"/>
  </symbol>

  <!-- Veranda: roof over railing posts -->
  <symbol id="tile-patio" viewBox="0 0 24 24">
    <path d="M2 8l10-4 10 4"/>
    <path d="M4 8v12M20 8v12"/>
    <path d="M8 13v7M12 13v7M16 13v7"/>
    <path d="M6 13h12"/>
  </symbol>

  <!-- Carriage House: a cart wheel -->
  <symbol id="tile-garage" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8"/>
    <circle cx="12" cy="12" r="2"/>
    <path d="M12 4v6M12 14v6M4 12h6M14 12h6"/>
  </symbol>

  <!-- Lawn: tufts of grass (shared by all three yard tiles) -->
  <symbol id="tile-yard" viewBox="0 0 24 24">
    <path d="M3 20h18"/>
    <path d="M6 20c0-4-1-6-2-7 2 0 4 2 4 7"/>
    <path d="M12 20c0-5-1-7-2-8 2.5 0 4 3 4 8"/>
    <path d="M18 20c0-4-1-6-2-7 2 0 4 2 4 7"/>
  </symbol>

  <!-- Arbour: a bench under an arch -->
  <symbol id="tile-sitting-area" viewBox="0 0 24 24">
    <path d="M4 12a8 8 0 0 1 16 0"/>
    <path d="M5 15h14"/>
    <path d="M7 15v4M17 15v4"/>
    <path d="M5 18h14"/>
  </symbol>

  <!-- Herb Garden: a sprig in a pot -->
  <symbol id="tile-garden" viewBox="0 0 24 24">
    <path d="M6 14h12l-1.5 6h-9z"/>
    <path d="M12 14V6"/>
    <path d="M12 9c-2 0-3.5-1-3.5-3 2 0 3.5 1 3.5 3"/>
    <path d="M12 11c2 0 3.5-1 3.5-3-2 0-3.5 1-3.5 3"/>
  </symbol>

  <!-- Family Plot: a headstone in turf -->
  <symbol id="tile-graveyard" viewBox="0 0 24 24">
    <path d="M7 20V10a5 5 0 0 1 10 0v10z"/>
    <path d="M12 12v5M9.5 14.5h5"/>
    <path d="M3 20h18"/>
  </symbol>

  <!-- ============================ Items ============================ -->

  <!-- Nailed Plank -->
  <symbol id="item-board-nails" viewBox="0 0 24 24">
    <path d="M3 9h18v6H3z"/>
    <path d="M8 9V5M13 9V6M18 9V5"/>
  </symbol>

  <!-- Splintered Bone -->
  <symbol id="item-grisly-femur" viewBox="0 0 24 24">
    <path d="M8 16l8-8"/>
    <circle cx="6.5" cy="17.5" r="2.5"/>
    <circle cx="17.5" cy="6.5" r="2.5"/>
    <path d="M4 14.5a2 2 0 1 0 2.5-2.5M19.5 9.5a2 2 0 1 0-2.5 2.5"/>
  </symbol>

  <!-- Fire Iron: a poker with a hooked head -->
  <symbol id="item-golf-club" viewBox="0 0 24 24">
    <path d="M7 3v13"/>
    <path d="M7 16c0 3 2 5 5 5h5"/>
    <path d="M5 3h4"/>
  </symbol>

  <!-- Billhook: a curved blade on a haft -->
  <symbol id="item-machete" viewBox="0 0 24 24">
    <path d="M5 21l5-5"/>
    <path d="M10 16c6 0 10-4 10-10-6 0-10 4-10 10z"/>
    <path d="M4 20l2 2"/>
  </symbol>

  <!-- Petrol Saw -->
  <symbol id="item-chainsaw" viewBox="0 0 24 24">
    <path d="M3 8h7v6H3z"/>
    <path d="M10 9h10a1 1 0 0 1 0 4H10z"/>
    <path d="M12 13v2M15 13v2M18 13v2"/>
    <path d="M5 14v3"/>
  </symbol>

  <!-- Bottled Tonic -->
  <symbol id="item-can-of-soda" viewBox="0 0 24 24">
    <path d="M10 3h4v3l2 3v12H8V9l2-3z"/>
    <path d="M8 14h8"/>
  </symbol>

  <!-- Lamp Oil: a flask with a drop -->
  <symbol id="item-oil" viewBox="0 0 24 24">
    <path d="M9 4h6v4l3 4v9H6v-9l3-4z"/>
    <path d="M12 13c1.5 1.5 2 2.5 2 3.5a2 2 0 0 1-4 0c0-1 .5-2 2-3.5z"/>
  </symbol>

  <!-- Petrol Can: a jerry can -->
  <symbol id="item-gasoline" viewBox="0 0 24 24">
    <path d="M4 7h12v14H4z"/>
    <path d="M16 11h3v7h-3"/>
    <path d="M7 7V5h6v2"/>
    <path d="M7 12h6"/>
  </symbol>

  <!-- Tallow Candle -->
  <symbol id="item-candle" viewBox="0 0 24 24">
    <path d="M9 10h6v11H9z"/>
    <path d="M12 10V8"/>
    <path d="M12 3c1.5 1.8 2 2.8 2 3.8a2 2 0 0 1-4 0c0-1 .5-2 2-3.8z"/>
  </symbol>

  <!-- ========================== Status ============================
       Drawn on the same 24x24 grid as everything else. The heart is filled or
       hollow from CSS, so one symbol covers both states. -->

  <symbol id="stat-heart" viewBox="0 0 24 24">
    <path d="M12 20.5S3.5 15 3.5 9.2A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 8.5 2.8c0 5.8-8.5 11.3-8.5 11.3z"/>
  </symbol>

  <symbol id="stat-sword" viewBox="0 0 24 24">
    <path d="M20 3.5v3.2L10.4 16.3 7.7 13.6 17.3 4h3.2z"/>
    <path d="M7.7 13.6 5 16.3l2.7 2.7 2.7-2.7"/>
    <path d="M4.2 19.8 6.6 17.4"/>
  </symbol>

  <!-- ========================== The risen ==========================
       Drawn on its own 120-unit grid rather than the shared 24, because this
       one is shown full-window and needs the detail. Square to square, so it
       still scales cleanly through the standard 24x24 wrapper. -->

  <symbol id="scare-zombie" viewBox="0 0 120 120">
    <!-- skull -->
    <path d="M27 52c0-19 15-33 33-33s33 14 33 33c0 12-4 19-9 25l-2 14c0 5-4 8-9 8H47c-5 0-9-3-9-8l-2-14c-5-6-9-13-9-25z"
          stroke-width="3.5"/>
    <!-- sunken sockets -->
    <path d="M40 55c0-6 5-10 11-10s10 4 10 10-4 11-10 11-11-5-11-11z" fill="currentColor" stroke-width="2"/>
    <path d="M69 55c0-6 4-10 10-10s10 4 10 10-4 11-10 11-10-5-10-11z" fill="currentColor" stroke-width="2"/>
    <!-- a wet gleam in each socket -->
    <circle cx="54" cy="53" r="2.4" fill="#0a0b0d" stroke="none"/>
    <circle cx="82" cy="53" r="2.4" fill="#0a0b0d" stroke="none"/>
    <!-- nose cavity -->
    <path d="M60 62l-5 12h10z" stroke-width="2.5"/>
    <!-- bared teeth -->
    <path d="M41 85h38" stroke-width="3"/>
    <path d="M47 85v9M55 85v11M63 85v9M71 85v11" stroke-width="2.5"/>
    <path d="M43 96h34" stroke-width="2.5"/>
    <!-- cracks across the temple -->
    <path d="M33 40l7 5-4 6M92 42l-8 4 4 7" stroke-width="2.5"/>
    <!-- reaching hand, lower left -->
    <path d="M14 108l10-12" stroke-width="3.5"/>
    <path d="M24 96c-3-4-1-8 2-9s6 1 7 4M31 89c-1-4 1-7 4-7s5 3 5 6M38 87c0-4 3-6 5-5s3 4 2 7"
          stroke-width="3"/>
  </symbol>

  <!-- ======================= Edges of a room =======================
       All drawn for the north wall, on the same 24x24 grid as everything else
       so they are not letterboxed: the wall runs along y=12, the room is below
       it, and "outward" is up. render.js rotates these for the other three
       sides, and the marker is centred on the wall so the two halves fall
       inside and outside the room. -->

  <!-- Shut: a door slab filling the opening. The room beyond is unexplored. -->
  <symbol id="edge-door-closed" viewBox="0 0 24 24">
    <rect x="3" y="7.5" width="18" height="9" rx="1" fill="currentColor" fill-opacity=".22"/>
    <rect x="3" y="7.5" width="18" height="9" rx="1"/>
    <circle cx="17.5" cy="12" r="1" fill="currentColor"/>
  </symbol>

  <!-- Open: the jambs stand, and the leaf has swung back into the room. -->
  <symbol id="edge-door-open" viewBox="0 0 24 24">
    <path d="M3 7.5v9M21 7.5v9"/>
    <path d="M3.8 12L13 21.5" stroke-width="2.4"/>
  </symbol>

  <!-- A zombie door: the wall itself is broken through, with rubble below. -->
  <symbol id="edge-wall-broken" viewBox="0 0 24 24">
    <path d="M0 12h3.2l2-3.6 2.5 5 3-4.6 2.5 5 2.4-4 2.2 3.2H24"/>
    <circle cx="9" cy="18.5" r=".9" fill="currentColor"/>
    <circle cx="14.6" cy="20" r=".7" fill="currentColor"/>
  </symbol>

  <!-- The arrow door: the one way between inside and out. -->
  <symbol id="edge-door-exterior" viewBox="0 0 24 24">
    <rect x="3" y="9" width="18" height="7.5" rx="1" fill="currentColor" fill-opacity=".22"/>
    <rect x="3" y="9" width="18" height="7.5" rx="1"/>
    <path d="M12 8V4.5"/>
    <path d="M9.6 6.4L12 4L14.4 6.4"/>
  </symbol>
</svg>
