    <path d="M84 84c0-14 3-20 6-24-7 0-13 7-13 24"/>
    <path d="M22 24c0-9-2-13-4-16 5 0 9 5 9 16"/>
    <path d="M74 26c0-9 2-13 4-16-5 0-9 5-9 16"/>
    <path d="M60 68a10 7 0 1 0 20 0 10 7 0 1 0-20 0"/>
    <path d="M18 46v14M18 46l-6-4M18 52l7-5"/>
