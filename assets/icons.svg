    <path d="M22 56v12M16 61h12"/>
    <path d="M64 76V56a8 8 0 0 1 16 0v20" stroke-width="2.4"/>
    <path d="M72 61v9M67 65h10"/>
    <path d="M38 18h22v26H38z" stroke-width="2.4" stroke-dasharray="5 4"/>
    <path d="M42 22h14v18H42z" stroke-opacity=".5"/>
    <path d="M6 84h84"/>
  </symbol>

  <!-- ============================ Items ============================ -->

  <!-- Nailed Plank -->
  <symbol id="item-board-nails" viewBox="0 0 24 24">
    <path d="M3 9h18v6H3z"/>
    <path d="M8 9V5M13 9V6M18 9V5"/>
  </symbol>

  <!-- Splintered Bone -->
  <symbol id="item-grisly-femur" viewBox="0 0 24 24">
