    <path d="M14 16v16M22 16v16M30 16v16M14 40v16M22 40v16M30 40v16"/>
    <path d="M62 30h20l-3 20H65z"/><path d="M72 30V16"/>
    <path d="M72 22c-5 0-8-3-8-8 5 0 8 3 8 8M72 26c5 0 8-3 8-8-5 0-8 3-8 8"/>
