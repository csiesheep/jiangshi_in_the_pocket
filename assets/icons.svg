  <symbol id="scene-patio" viewBox="0 0 96 96">
    <path d="M6 20h84"/><path d="M14 20v14M30 20v14M46 20v14M62 20v14M78 20v14"/>
    <path d="M6 34h84"/>
    <path d="M12 60h26v18H12z"/><path d="M12 68h26"/>
    <path d="M64 58h18v22H64z"/><path d="M68 58c0-6 5-9 5-9s5 3 5 9"/>
