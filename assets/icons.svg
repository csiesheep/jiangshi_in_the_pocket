    <path d="M24 30l10-12h28l10 12" stroke-width="2.4"/>
    <path d="M48 42v18M39 51h18" stroke-width="2.4"/>
    <path d="M30 74v10M66 74v10"/>
    <path d="M14 40v22M82 40v22"/>
    <path d="M14 40c0-5 3-8 3-8M82 40c0-5-3-8-3-8"/>
    <path d="M36 78h24" stroke-opacity=".6"/>
